# The Android app's APK, built on every push that touches mobile/.
#
# Release mode with the debug key Expo's template signs with: installable on
# any phone that allows installs from outside a store, and not the key a
# store listing will use. arm64 only, which is every phone Spot targets
# (Solana Seeker included) and a third of the build time.
#
# When the repository holds Spot's dApp Store key (the SPOT_RELEASE_*
# secrets, see mobile/README.md), the same build is also signed with it:
# that second APK is the one the Solana dApp Store takes.
#
# A push to main also publishes the build as the "test" release, so a phone
# can fetch the newest one from a fixed link (and the app can say an update
# is out): https://github.com/vercettilev/spot-landing/releases/download/test/spot.apk
name: Android APK

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      HAS_RELEASE_KEY: ${{ secrets.SPOT_RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

      # android/ is generated, never committed (Continuous Native Generation).
      - run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk "spot-$(node -p "require('./package.json').version")-${GITHUB_SHA::7}.apk"

      # The key never touches the repo: it is decoded into the runner's temp
      # folder, used once and deleted. 16 KB alignment for the native
      # libraries, as Android 15 phones require, is kept through the signing.
      - name: Sign for the dApp Store
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          SPOT_RELEASE_KEYSTORE: ${{ secrets.SPOT_RELEASE_KEYSTORE }}
          SPOT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SPOT_RELEASE_KEYSTORE_PASSWORD }}
          SPOT_RELEASE_KEY_ALIAS: ${{ secrets.SPOT_RELEASE_KEY_ALIAS }}
          SPOT_RELEASE_KEY_PASSWORD: ${{ secrets.SPOT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keystore="$RUNNER_TEMP/spot-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SPOT_RELEASE_KEYSTORE" | base64 -d > "$keystore"
          out="spot-$(node -p "require('./package.json').version")-${GITHUB_SHA::7}-dapp-store.apk"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:SPOT_RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$SPOT_RELEASE_KEY_ALIAS" --key-pass env:SPOT_RELEASE_KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          certs="$("$tools/apksigner" verify --print-certs "$out")"
          echo "$certs"
          if grep -q "CN=Android Debug" <<<"$certs"; then echo "::error::That keystore is the debug key."; exit 1; fi
          "$tools/zipalign" -c -P 16 4 "$out"
          # Wallets (Phantom, Seed Vault) check that the app connecting as
          # usespot.fun is signed with a key the site lists; until it does,
          # they warn the app may be impersonating another. The statement to
          # publish, ready to paste, in this run's summary.
          sha="$(grep -m1 'Signer #1 certificate SHA-256 digest' <<<"$certs" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          {
            echo "### public/.well-known/assetlinks.json"
            echo "Commit this file at the repo root's public/.well-known/ so wallets verify the store build as usespot.fun:"
            echo '```json'
            printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"fun.usespot.app","sha256_cert_fingerprints":["%s"]}}]\n' "$sha"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: spot-android
          path: mobile/spot-*.apk
          if-no-files-found: error
          retention-days: 30

      # The test channel: one fixed link to the newest build from main, and a
      # version.json the app reads to say "Update to x.y.z" in Me. The store
      # build rides along when there is one, for the portal.
      - name: Publish the test build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          code="$(node -p "require('./app.json').expo.android.versionCode")"
          cp "spot-$v-${GITHUB_SHA::7}.apk" spot.apk
          printf '{"version":"%s","versionCode":%s,"commit":"%s","apk":"https://github.com/%s/releases/download/test/spot.apk"}\n' \
            "$v" "$code" "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" > version.json
          assets=(spot.apk version.json)
          if ls spot-*-dapp-store.apk >/dev/null 2>&1; then cp spot-*-dapp-store.apk spot-dapp-store.apk; assets+=(spot-dapp-store.apk); fi
          gh release delete test --yes --cleanup-tag || true
          gh release create test "${assets[@]}" --title "Spot $v ($code), test build" \
            --notes "The newest build from main (${GITHUB_SHA::7}), signed with the debug key: for testing, not the store. Install over the previous test build; the store build, when present, is spot-dapp-store.apk."
