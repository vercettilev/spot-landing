<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spot banners</title>
<!-- The site's display face, Rubik Black. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&display=block" rel="stylesheet">
<style>
  /* Tokens copied from src/app/globals.css. */
  :root {
    --orange: #fc4e02;
    --ink: #0b0b0c;
    --white: #ffffff;
    --display: "Rubik", "Arial Black", system-ui, sans-serif;
  }

  body {
    margin: 0;
    padding: 48px;
    background: #2b2b2e;
    display: grid;
    gap: 48px;
    justify-items: start;
  }

  /* ONE ARTBOARD PER FILE, the line and one other thing: the apps on X,
     the puppy on LinkedIn. render.cjs screenshots each .board by its id. */
  .board {
    position: relative;
    overflow: hidden;
    width: var(--w);
    height: var(--h);
    background: var(--orange);
    color: var(--ink);
  }

  .board.black {
    background: var(--ink);
    color: var(--white);
  }

  .h1 {
    position: absolute;
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.035em;
    word-spacing: 0.06em;
    white-space: nowrap;
  }

  /* The puppy sits on the bottom edge, paws and all, as it does in the icon.
     The drawing is 1.5149 times as wide as it is tall (PUPPY_ASPECT). */
  .pup {
    position: absolute;
    bottom: 0;
    width: var(--pup-w);
    height: calc(var(--pup-w) / 1.5149);
    overflow: visible;
  }

  /* THE APPS the posts come from, in the line's colour: the three the site
     names (TikTok, Reddit, X), so the row claims no more than the page. */
  .apps {
    position: absolute;
    display: flex;
    gap: var(--apps-gap);
  }

  .apps svg {
    width: var(--apps-size);
    height: var(--apps-size);
    fill: currentColor;
  }

  /* ---------- X / Twitter header, 1500 x 500 ----------
     Laid out for the phone, where most people see it. In the X app the
     header runs the full width of the screen, about 3.8 banner pixels to a
     point, and the app draws over three parts of it: the status bar and the
     Dynamic Island across the top (to about y 190), the back, search and
     menu buttons at the left and right edges (x under 190 and over 1160,
     from about y 240 down) and the photo over the bottom left (x under 380,
     from about y 340). So the line and the apps sit in the middle, low,
     and nothing sits at the edges. No puppy here: the profile photo is the
     puppy, right under the header. */
  .x {
    --w: 1500px;
    --h: 500px;
  }

  .x .h1 {
    left: 0;
    right: 0;
    top: 196px;
    font-size: 84px;
    text-align: center;
  }

  .x .apps {
    left: 0;
    right: 0;
    top: 386px;
    justify-content: center;
    --apps-size: 56px;
    --apps-gap: 44px;
  }

  /* ---------- LinkedIn cover, 1584 x 396 ----------
     The photo comes up to a little under half the height on the left, so the
     line runs on one row above it. */
  .li {
    --w: 1584px;
    --h: 396px;
    --pup-w: 360px;
  }

  .li .h1 {
    left: 96px;
    top: 104px;
    font-size: 64px;
  }

  .li .pup {
    right: 110px;
  }
</style>
</head>
<body>

<!-- The line is the five-word pitch: what you get (crypto) and the twist
     (from any post). It is not the site's headline (TAGLINE in
     src/lib/site.ts); when one changes, decide whether the other should. -->
<section class="board x" id="x-header">
  <h1 class="h1">Buy crypto<br>from any post.</h1>
  <div class="apps" data-apps></div>
</section>

<section class="board x black" id="x-header-black">
  <h1 class="h1">Buy crypto<br>from any post.</h1>
  <div class="apps" data-apps></div>
</section>

<section class="board li" id="linkedin-cover">
  <h1 class="h1">Buy crypto from any post.</h1>
  <svg class="pup" data-face=""></svg>
</section>

<section class="board li black" id="linkedin-cover-black">
  <h1 class="h1">Buy crypto from any post.</h1>
  <svg class="pup" data-face="" data-halo></svg>
</section>

<!-- X, TikTok and Reddit, single-colour, from Simple Icons (simpleicons.org,
     CC0). The marks belong to X Corp., TikTok and Reddit, Inc.; they stand
     for where the posts come from, as the site's own copy names them. -->
<template id="apps">
  <svg viewBox="0 0 24 24" aria-label="X"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>

  <svg viewBox="0 0 24 24" aria-label="Reddit"><path d="M12 0C5.373 0 0 5.373 0 12c0 3.314 1.343 6.314 3.515 8.485l-2.286 2.286C.775 23.225 1.097 24 1.738 24H12c6.627 0 12-5.373 12-12S18.627 0 12 0Zm4.388 3.199c1.104 0 1.999.895 1.999 1.999 0 1.105-.895 2-1.999 2-.946 0-1.739-.657-1.947-1.539v.002c-1.147.162-2.032 1.15-2.032 2.341v.007c1.776.067 3.4.567 4.686 1.363.473-.363 1.064-.58 1.707-.58 1.547 0 2.802 1.254 2.802 2.802 0 1.117-.655 2.081-1.601 2.531-.088 3.256-3.637 5.876-7.997 5.876-4.361 0-7.905-2.617-7.998-5.87-.954-.447-1.614-1.415-1.614-2.538 0-1.548 1.255-2.802 2.803-2.802.645 0 1.239.218 1.712.585 1.275-.79 2.881-1.291 4.64-1.365v-.01c0-1.663 1.263-3.034 2.88-3.207.188-.911.993-1.595 1.959-1.595Zm-8.085 8.376c-.784 0-1.459.78-1.506 1.797-.047 1.016.64 1.429 1.426 1.429.786 0 1.371-.369 1.418-1.385.047-1.017-.553-1.841-1.338-1.841Zm7.406 0c-.786 0-1.385.824-1.338 1.841.047 1.017.634 1.385 1.418 1.385.785 0 1.473-.413 1.426-1.429-.046-1.017-.721-1.797-1.506-1.797Zm-3.703 4.013c-.974 0-1.907.048-2.77.135-.147.015-.241.168-.183.305.483 1.154 1.622 1.964 2.953 1.964 1.33 0 2.47-.81 2.953-1.964.057-.137-.037-.29-.184-.305-.863-.087-1.795-.135-2.769-.135Z"/></svg>
</template>

<script>
  const apps = document.getElementById("apps");
  for (const row of document.querySelectorAll("[data-apps]")) row.append(apps.content.cloneNode(true));
</script>
</body>
</html>
