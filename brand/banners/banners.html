<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spot banners</title>
<!-- The site's display face, Rubik Black. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&display=block" rel="stylesheet">
<style>
  /* Tokens copied from src/app/globals.css. */
  :root {
    --orange: #fc4e02;
    --ink: #0b0b0c;
    --white: #ffffff;
    --display: "Rubik", "Arial Black", system-ui, sans-serif;
  }

  body {
    margin: 0;
    padding: 48px;
    background: #2b2b2e;
    display: grid;
    gap: 48px;
    justify-items: start;
  }

  /* ONE ARTBOARD PER FILE, two things on each: the line and the puppy.
     render.cjs screenshots each .board by its id. */
  .board {
    position: relative;
    overflow: hidden;
    width: var(--w);
    height: var(--h);
    background: var(--orange);
    color: var(--ink);
  }

  .board.black {
    background: var(--ink);
    color: var(--white);
  }

  .h1 {
    position: absolute;
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.035em;
    word-spacing: 0.06em;
    white-space: nowrap;
  }

  /* The puppy sits on the bottom edge, paws and all, as it does in the icon.
     The drawing is 1.5149 times as wide as it is tall (PUPPY_ASPECT). */
  .pup {
    position: absolute;
    bottom: 0;
    width: var(--pup-w);
    height: calc(var(--pup-w) / 1.5149);
    overflow: visible;
  }

  /* ---------- X / Twitter header, 1500 x 500 ----------
     The avatar covers a half-circle about 335px wide at the bottom left, so
     the line sits above y 330 and the puppy goes right. */
  .x {
    --w: 1500px;
    --h: 500px;
    --pup-w: 440px;
  }

  .x .h1 {
    left: 96px;
    top: 128px;
    font-size: 88px;
  }

  .x .pup {
    right: 110px;
  }

  /* ---------- LinkedIn cover, 1584 x 396 ----------
     The photo comes up to a little under half the height on the left, so the
     line runs on one row above it. */
  .li {
    --w: 1584px;
    --h: 396px;
    --pup-w: 360px;
  }

  .li .h1 {
    left: 96px;
    top: 104px;
    font-size: 64px;
  }

  .li .pup {
    right: 110px;
  }
</style>
</head>
<body>

<section class="board x" id="x-header">
  <h1 class="h1">The buy button<br>for every app.</h1>
  <svg class="pup" data-face=""></svg>
</section>

<section class="board x black" id="x-header-black">
  <h1 class="h1">The buy button<br>for every app.</h1>
  <svg class="pup" data-face="" data-halo></svg>
</section>

<section class="board li" id="linkedin-cover">
  <h1 class="h1">The buy button for every app.</h1>
  <svg class="pup" data-face=""></svg>
</section>

<section class="board li black" id="linkedin-cover-black">
  <h1 class="h1">The buy button for every app.</h1>
  <svg class="pup" data-face="" data-halo></svg>
</section>

</body>
</html>
